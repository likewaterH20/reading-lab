<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reading Lab · Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #10211c; --panel: #17302a; --panel-2: #1f3d35; --line: #2c4d44; --text: #f4efe4; --muted: #a7b8b0; --accent: #f2b64c; --miss: #ff8d78; --r: 12px; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 26px; margin: 0; } h2 { font-size: 22px; margin: 0; }
.note { color: var(--muted); margin: 0; font-size: 15px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat b { display: block; font-size: 24px; letter-spacing: -.02em; }
.stat span { color: var(--muted); font-size: 13px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--panel-2); color: var(--muted); }
.dot.pass { background: var(--accent); color: #1a1405; } .dot.part { background: none; box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); font-size: 10px; width: 34px; border-radius: 13px; }
.focus { border-left: 3px solid var(--accent); padding-left: 10px; margin: 0; }
svg { width: 100%; height: 70px; } svg path { fill: none; stroke: var(--accent); stroke-width: 2.5; } svg text { fill: var(--muted); font-size: 11px; }
.ago.stale { color: var(--miss); }
.today { font-size: 20px; font-weight: 700; } .today.ok { color: var(--accent); } .today.no { color: var(--text); }
svg.bars { height: 90px; } svg.bars rect.hit { fill: var(--accent); } svg.bars rect.miss { fill: var(--panel-2); }
svg.bars line.goal { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; } svg.bars text { fill: var(--muted); font-size: 11px; }
.rm { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main id="app"><p class="note">Loading…</p></main>
<script>
/* The coach view. Open as coach.html#<coach>:<key>. The key never leaves the browser except to the sync worker. */
const SYNC_URL = 'https://reading-lab-sync.likewater.workers.dev';
const app = document.getElementById('app');
const el = (tag, cls, ...kids) => { const n = document.createElement(tag); if (cls) n.className = cls; for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : String(k)); return n; };
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; };
function line(vals) {
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', '0 0 300 70');
  if (vals.length < 2) return null;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, i) => [10 + i * 280 / (vals.length - 1), 58 - (v - lo) / span * 46]);
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d', 'M' + pts.map(x => x.join(',')).join(' L')); svg.append(p);
  for (const [i, v] of [[0, vals[0]], [vals.length - 1, vals[vals.length - 1]]]) { const tx = document.createElementNS(ns, 'text'); tx.setAttribute('x', pts[i][0] - (i ? 24 : 0)); tx.setAttribute('y', pts[i][1] - 6); tx.textContent = v; svg.append(tx); }
  return svg;
}
/* the 10-minute goal (his 10/31 word: "i jsut want to be able to know if hes using the app 10mins a day") */
const GOAL = 10;
function minutesBlock(d) {
  const days = (d.minutes || []).slice(-7);
  if (!days.length) return null;
  const todayM = days[days.length - 1].m, hit = days.filter(x => x.m >= GOAL).length;
  const max = Math.max(GOAL * 1.5, ...days.map(x => x.m));
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', '0 0 300 90'); svg.classList.add('bars');
  days.forEach((x, i) => {
    const h = Math.max(2, 64 * x.m / max), r = document.createElementNS(ns, 'rect');
    r.setAttribute('x', 8 + i * 42); r.setAttribute('y', 70 - h); r.setAttribute('width', 30); r.setAttribute('height', h); r.setAttribute('rx', 4);
    r.setAttribute('class', x.m >= GOAL ? 'hit' : 'miss'); svg.append(r);
    const lb = document.createElementNS(ns, 'text'); lb.setAttribute('x', 23 + i * 42); lb.setAttribute('y', 86); lb.setAttribute('text-anchor', 'middle');
    lb.textContent = new Date(x.d + 'T12:00').toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 2); svg.append(lb);
    const v = document.createElementNS(ns, 'text'); v.setAttribute('x', 23 + i * 42); v.setAttribute('y', 66 - h); v.setAttribute('text-anchor', 'middle'); v.textContent = x.m; svg.append(v);
  });
  const gy = 70 - 64 * GOAL / max, g = document.createElementNS(ns, 'line');
  g.setAttribute('x1', 4); g.setAttribute('x2', 296); g.setAttribute('y1', gy); g.setAttribute('y2', gy); g.setAttribute('class', 'goal'); svg.append(g);
  return [el('div', 'today ' + (todayM >= GOAL ? 'ok' : 'no'), 'Today: ' + todayM + ' min ' + (todayM >= GOAL ? '✓ goal met' : '· goal ' + GOAL)),
          svg, el('p', 'note', hit + ' of the last ' + days.length + ' days at ' + GOAL + ' minutes or more')];
}
function learnerCard(L) {
  const d = L.data || {};
  /* one dot per sound lesson: amber = all five practices passed, outlined = in progress (n/5) */
  const dots = el('div', 'dots', Array.from({ length: 12 }, (_, i) => {
    const n = i + 1, p = (d.soundPrac || {})[n] || 0;
    return el('span', 'dot' + (p >= 5 ? ' pass' : p > 0 ? ' part' : ''), p > 0 && p < 5 ? p + '/5' : n);
  }));
  const speeds = (d.reads || []).map(r => r.speed);
  const stale = Date.now() - (d.lastActive || L.updated) > 3 * 864e5;
  return el('div', 'card',
    el('div', 'row', el('h2', null, L.name), el('span', 'note ago' + (stale ? ' stale' : ''), 'last practice ' + ago(d.lastActive || L.updated))),
    minutesBlock(d),
    el('div', 'stats',
      el('div', 'stat', el('b', null, d.level + ' / ' + (d.of || 13)), el('span', null, 'reading level' + (d.placed ? ' (started ' + d.placed + ')' : ''))),
      el('div', 'stat', el('b', null, (d.soundsDone || 0) + ' / 12'), el('span', null, 'sound lessons')),
      el('div', 'stat', el('b', null, d.owned || 0), el('span', null, 'words owned')),
      el('div', 'stat', el('b', null, d.days || 0), el('span', null, 'days practised'))),
    dots,
    speeds.length > 1 ? [el('p', 'note', 'Reading speed, last tests'), line(speeds)] : null,
    d.sayRight != null ? el('p', 'note', 'Said right out loud: ' + d.sayRight + '%') : null,
    (d.focus || []).length ? el('p', 'focus', 'Working on: ' + d.focus[0]) : null,
    (d.stumbles || []).length ? el('p', 'note', 'Stumbles on: ' + d.stumbles.join(', ')) : null,
    el('div', 'row', el('span'), (() => { const b = el('button', 'rm', 'Remove'); b.onclick = () => removeLearner(L); return b; })()));
}
async function removeLearner(L) {
  if (!confirm('Remove ' + L.name + ' from your list? Their app keeps working; you stop seeing it.')) return;
  const [coach, key] = decodeURIComponent(location.hash.slice(1)).split(':');
  await fetch(SYNC_URL + '/c/' + coach + '/' + L.uid, { method: 'DELETE', headers: { Authorization: 'Bearer ' + key } });
  location.reload();
}
(async () => {
  const [coach, key] = decodeURIComponent(location.hash.slice(1)).split(':');
  if (!SYNC_URL) return app.replaceChildren(el('p', 'note', 'Not switched on yet.'));
  if (!coach || !key) return app.replaceChildren(el('p', 'note', 'Open this page from your private coach link.'));
  try {
    const r = await fetch(SYNC_URL + '/c/' + coach, { headers: { Authorization: 'Bearer ' + key } });
    if (!r.ok) return app.replaceChildren(el('p', 'note', r.status === 401 ? 'That link is not valid.' : 'Could not load (' + r.status + ').'));
    const { learners } = await r.json();
    app.replaceChildren(el('h1', null, 'Your learners'),
      el('p', 'note', learners.length ? 'Newest activity first. Refresh to update.' : 'Nobody yet. Send the learner link; they appear after their first session.'),
      ...learners.map(learnerCard));   // spread: native replaceChildren prints an array as "[object ...]"
  } catch (e) { app.replaceChildren(el('p', 'note', 'Could not reach the server.')); }
})();
</script>
</body>
</html>
