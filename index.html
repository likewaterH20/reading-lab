<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Reading Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Instrument+Sans:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0c; --panel: #141416; --panel-2: #1b1b1e; --line: #2a2a2f;
  --text: #f3f2ee; --muted: #a3a3a8; --accent: #00a8a2; --accent-ink: #001a19;
  --miss: #ff7a6b; --gap: 16px; --r: 14px;
  --serif: "Bodoni Moda", "Didot", Georgia, serif;
  /* anything you read, type or spell: a face built so letters cannot be confused */
  --read: "Atkinson Hyperlegible", "Instrument Sans", system-ui, sans-serif;
  --reading: #e7e5df;
  --sans: "Instrument Sans", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f5f1; --panel: #ffffff; --panel-2: #efeee9; --line: #dcdad3;
    --text: #151515; --muted: #5d5d62; --accent: #008480; --accent-ink: #ffffff; --miss: #c8392b; --reading: #1f1f1f;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 var(--read); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 680px; margin: 0 auto; padding: 12px var(--gap); display: flex; align-items: center; gap: 12px; }
.brand { font: 600 20px/1 var(--serif); letter-spacing: .01em; white-space: nowrap; }
.brand em { font-style: normal; color: var(--accent); }
#nav { display: flex; gap: 4px; flex: 1; justify-content: center; }
#meta { display: flex; align-items: center; gap: 10px; }
.tab { background: none; border: 0; padding: 8px 10px; border-radius: 10px; color: var(--muted); font-weight: 500; }
.tab.on { color: var(--text); background: var(--panel-2); }
.day { color: var(--muted); font-size: 14px; white-space: nowrap; }
body.running #nav, body.running #meta { visibility: hidden; }

main { max-width: 680px; margin: 0 auto; padding: 28px var(--gap) 80px; }
.screen { display: flex; flex-direction: column; gap: var(--gap); }
h1 { font: 700 clamp(28px, 6.5vw, 40px)/1.2 var(--read); margin: 8px 0 0; }
h2 { font: 700 24px/1.3 var(--read); margin: 0; }
.sub { color: var(--muted); margin: -6px 0 0; }
.lead { font-size: 20px; line-height: 1.45; margin: 0; }
.note { color: var(--muted); margin: 0; font-size: 15px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.eyebrow.ok { color: var(--accent); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.card.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card.best { border-color: var(--accent); }
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--gap); }
.stat { display: flex; flex-direction: column; }
.stat b { font: 700 26px/1.15 var(--read); }
.stat span { color: var(--muted); font-size: 14px; }
.stat.big b { font-size: clamp(40px, 11vw, 60px); }
.fromto { display: flex; gap: 24px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.chip { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
button.chip.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.when { color: var(--muted); margin: 0; }

.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 13px 20px; border-radius: 12px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; }
.btn:disabled { opacity: .5; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.small { font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 6px; }

.choices { display: flex; flex-direction: column; gap: 10px; }
.choices.grid { display: grid; grid-template-columns: 1fr 1fr; }
.choice { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
.choice b { font-weight: 600; }
.choice small { color: var(--muted); }
.choice.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel)); }
.choice.on b::after { content: "  ✓"; color: var(--accent); }

/* the run */
.run { gap: 20px; }
.runbar { display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 4px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.streak { font-size: 13px; color: var(--accent); white-space: nowrap; }
.stage { display: flex; flex-direction: column; gap: 18px; min-height: 60vh; position: relative; }
.word { font: 700 clamp(42px, 12vw, 68px)/1.1 var(--read); letter-spacing: 0; overflow-wrap: anywhere; }
.word.mid { font-size: clamp(34px, 9vw, 48px); }
.word.es { color: var(--muted); }
.word-block { display: flex; flex-direction: column; gap: 8px; }
.saylike { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.saylike .lbl { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.saylike .rs { font-size: 22px; letter-spacing: .02em; }
.saylike b { color: var(--accent); font-weight: 700; text-transform: uppercase; }
.gloss { font-size: 19px; color: var(--muted); }
.legend { font-size: 13px; color: var(--muted); margin: 0; }
.sentence { font: 400 clamp(21px, 5vw, 25px)/1.6 var(--read); color: var(--reading); margin: 0; max-width: 34em; }
.sentence .w { transition: color .08s, background .08s; border-radius: 4px; }
.sentence .w.term { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 5px; text-decoration-thickness: 2px; }
.sentence .w.lit { color: var(--accent-ink); background: var(--accent); }
.listen { display: flex; align-items: center; gap: 12px; }
.play { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.answer { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; color: var(--text); font: 400 26px/1.3 var(--read); outline: none; }
.answer.long { font-size: 22px; resize: vertical; }
.answer:focus { border-color: var(--accent); }
.fb { display: flex; flex-direction: column; gap: 6px; }
.diff { font: 700 32px/1.3 var(--read); letter-spacing: .04em; }
.diff.sent { font-size: 24px; }
.diff .ok { color: var(--accent); }
.diff .miss { color: var(--miss); text-decoration: underline; text-underline-offset: 4px; }
.heard { font-size: 18px; }
.heard .ok { color: var(--accent); } .heard .miss { color: var(--miss); }
.result { display: flex; flex-direction: column; gap: 12px; }
.scores { display: flex; gap: 28px; }
.cue { color: var(--accent); font-weight: 600; margin: 0; }
.meter { height: 6px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .05s; }
.contour { width: 100%; height: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.contour path, .arrowline path { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.c-model { stroke: var(--accent); }
.c-user { stroke: var(--text); stroke-dasharray: 1 0; opacity: .9; }
.slots { display: grid; gap: 6px; }
.slot { width: 100%; height: 60px; border-bottom: 3px solid var(--line); display: grid; place-items: center; font: 700 36px/1 var(--read); }
.slot.filled { border-color: var(--accent); }
.slot.gap { width: 18px; border: 0; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.tile { width: 58px; height: 58px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font: 700 28px/1 var(--read); }
.tile:disabled { opacity: .15; }
.shake { animation: shake .3s; border-color: var(--miss); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.rule { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; }
.arrow { color: var(--accent); }
.pairs { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.pairrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: left; background: var(--panel); border: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; align-items: baseline; }
.pairrow:last-child { border-bottom: 0; }
.pairrow .es { color: var(--muted); }
.pairrow .en { font: 700 21px/1.2 var(--read); }
.pairrow .rs .saylike .lbl { display: none; }
.pairrow .rs .saylike .rs { font-size: 16px; }
.pair { display: flex; gap: 10px; align-items: baseline; font-size: 22px; }
.pair .es { color: var(--muted); }
.melrow { display: grid; grid-template-columns: 160px 1fr; gap: 16px; align-items: center; }
.arrowline { width: 160px; }
.arrowline .contour { border: 0; background: none; }
/* level map */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.level { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); text-align: left; }
.level b { font: 700 28px/1 var(--read); }
.level .lname { font-size: 12px; color: var(--muted); }
.level .lbar { width: 100%; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
.level .lbar i { display: block; height: 100%; background: var(--accent); }
.level .tick { position: absolute; top: 8px; right: 10px; color: var(--accent); font-weight: 700; }
.level.current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.level.locked { opacity: .35; cursor: default; }
.level .lock { height: 4px; }
/* reading test */
.passage { font: 400 clamp(19px, 4.6vw, 22px)/1.75 var(--read); color: var(--reading); margin: 0; max-width: 34em; letter-spacing: .01em; }
.passage .w { cursor: pointer; border-radius: 4px; }
.passage .w.said { color: var(--accent); }
.passage .w.here { box-shadow: 0 2px 0 var(--accent); }
.passage .w.miss { color: var(--miss); text-decoration: underline; text-underline-offset: 4px; }
.steps { display: flex; gap: 14px; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.steps .on { color: var(--accent); font-weight: 700; }
.steps .past { color: var(--text); }
.passage .w.lit { color: var(--accent-ink); background: var(--accent); }
.choice.lit { border-color: var(--accent); }
.choice.right { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--panel)); }
.choice.wrong { border-color: var(--miss); background: color-mix(in srgb, var(--miss) 14%, var(--panel)); }
.opened { color: var(--accent); font-weight: 600; }
.note.warn { color: var(--miss); }
.sound-gate { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; padding: 14px 22px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.fact .sentence { font-size: clamp(22px, 5.4vw, 27px); }
h2.q { font: 700 clamp(21px, 5vw, 25px)/1.35 var(--read); }
.pic { width: min(280px, 70vw); aspect-ratio: 1; object-fit: cover; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); }
.pic.small { width: min(140px, 36vw); }
.trick { border-left: 3px solid var(--accent); padding-left: 14px; }
.hl { color: var(--accent); }
.hl-big { color: var(--accent); }
.traphead { display: flex; flex-direction: column; gap: 2px; }
.traphead .es { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--miss); }
.hero { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.hero .stat.big b { font-size: clamp(30px, 6.5vw, 46px); white-space: nowrap; }
.hero { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.linkish { background: none; border: 0; padding: 4px 0; color: var(--accent); font: 400 19px/1.4 var(--read); text-align: left; }
.autobar { position: absolute; left: 0; right: 0; bottom: -12px; height: 2px; background: transparent; }
.autobar i { display: block; height: 100%; width: 0; background: var(--accent); opacity: .6; }

.filters { gap: 6px; }
.list { display: flex; flex-direction: column; }
.wrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) 80px 36px; gap: 12px; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; text-align: left; }
.wrow .w { font: 700 19px/1.2 var(--read); overflow-wrap: anywhere; }
.wrow .g { color: var(--muted); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrow .sbar { height: 5px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.wrow .sbar i { display: block; height: 100%; background: var(--accent); }
.wrow .d { color: var(--muted); font-size: 13px; text-align: right; }
.chart { width: 100%; height: auto; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
.chart .dot { fill: var(--accent); }
.chart .lab { fill: var(--text); font: 600 15px var(--sans); }
.chart .lab.dim { fill: var(--muted); }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: start center; padding: 40px var(--gap); z-index: 20; overflow-y: auto; }
.panel { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.danger { margin-top: 10px; }

.pf { display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 520px) {
  .bar { gap: 4px; }
  .brand { font-size: 16px; }
  .tab { padding: 6px 5px; font-size: 14px; }
  .pf-label { display: none; }
  .hero { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .hero .stat.big b { font-size: clamp(22px, 7vw, 30px); white-space: normal; overflow-wrap: anywhere; }
  .slot { font-size: clamp(20px, 6vw, 36px); height: 48px; }
  .hero .stat span { font-size: 12px; }
  .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .level { padding: 10px; }
  .level b { font-size: 24px; }
  .pf { padding: 6px; }
  .day { display: none; }
  .choices.grid { grid-template-columns: 1fr; }
  .card.two { grid-template-columns: 1fr; }
  .wrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 54px; }
  .wrow .d { display: none; }
  .pairrow { grid-template-columns: 1fr 1fr; }
  .pairrow .rs { grid-column: 1 / -1; margin-top: -6px; }
  .melrow { grid-template-columns: 1fr; gap: 4px; }
  .arrowline { width: 100%; max-width: 260px; }
}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">Reading <em>Lab</em></div>
  <nav id="nav"></nav>
  <div id="meta"></div>
</div></header>
<main id="app"></main>
<script src="content.js"></script>
<script src="srs.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
